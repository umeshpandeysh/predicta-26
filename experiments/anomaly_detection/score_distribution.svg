<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" style="background-color:#0b132b; font-family:sans-serif;">
  <rect x="0" y="0" width="500" height="300" fill="#0b132b" />
  <text x="250" y="30" fill="#00f2fe" font-size="14" font-weight="600" text-anchor="middle">Anomaly Scores Distribution (Module A)</text>
  
  <!-- Grid Lines -->
  <line x1="50" y1="240" x2="450" y2="240" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <line x1="50" y1="80" x2="450" y2="80" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4" />
  <line x1="50" y1="160" x2="450" y2="160" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4" />

  <!-- Y Axis Labels -->
  <text x="40" y="244" fill="#a0aec0" font-size="9" text-anchor="end">0</text>
  <text x="40" y="164" fill="#a0aec0" font-size="9" text-anchor="end">50%</text>
  <text x="40" y="84" fill="#a0aec0" font-size="9" text-anchor="end">100%</text>
  
  <!-- Histograms Columns (Healthy vs Anomaly) -->
  <!-- Healthy distribution peak around low scores -->
  <rect x="70" y="90" width="50" height="150" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="1.5" rx="3" />
  <rect x="130" y="110" width="50" height="130" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="1.5" rx="3" />
  <rect x="190" y="160" width="50" height="80" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="1.5" rx="3" />
  
  <!-- Outlier distribution peak around high scores -->
  <rect x="310" y="210" width="50" height="30" fill="rgba(255, 94, 98, 0.2)" stroke="#ff5e62" stroke-width="1.5" rx="3" />
  <rect x="370" y="180" width="50" height="60" fill="rgba(255, 94, 98, 0.2)" stroke="#ff5e62" stroke-width="1.5" rx="3" />
  
  <!-- Cut-off Line -->
  <line x1="270" y1="60" x2="270" y2="250" stroke="#ff5e62" stroke-width="1.5" stroke-dasharray="4" />
  <text x="275" y="75" fill="#ff5e62" font-size="9" font-weight="600">Dynamic Cut-off Limit</text>

  <!-- Legend -->
  <rect x="130" y="270" width="12" height="12" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" />
  <text x="150" y="280" fill="#e2e8f0" font-size="10">Healthy (Low Score)</text>
  
  <rect x="290" y="270" width="12" height="12" fill="rgba(255, 94, 98, 0.2)" stroke="#ff5e62" />
  <text x="310" y="280" fill="#e2e8f0" font-size="10">Latent Defect (High Score)</text>
</svg>