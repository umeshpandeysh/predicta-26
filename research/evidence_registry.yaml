- id: "nbti_power_law"
  claim: "BTI-induced threshold voltage shift follows a time power-law: dVth(t) = A * t^n with n ~ 0.16 to 0.25."
  source_type: "academic_literature"
  source: "Singh, K. & Kalra, S. (2022) IEEE TDMR"
  title: "Analysis of Negative-Bias Temperature Instability Utilizing ML SVR"
  organization: "IEEE"
  url: "https://doi.org/10.1109/TDMR.2022.3175841"
  publication_date: "2022"
  relevant_section: "Section III"
  relevance: "Establishes physical base for Module B Gaussian Process Regression power-law kernel modeling."
  status: "VERIFIED"

- id: "pat_robust_median"
  claim: "Robust limits for dynamic Part Average Testing are calculated as Median +/- 6 * robust_sigma where robust_sigma = 1.4826 * MAD."
  source_type: "standards_organizations"
  source: "AEC-Q001 Rev-D Guideline"
  title: "Guidelines for Part Average Testing"
  organization: "Automotive Electronics Council"
  url: "http://www.aecouncil.com/"
  publication_date: "2003"
  relevant_section: "Section 3.2.1"
  relevance: "Forms the baseline statistical logic for Module A lot outlier thresholds."
  status: "VERIFIED"

- id: "arrhenius_burnin_acceleration"
  claim: "Temperature acceleration for burn-in testing is calculated via the Arrhenius equation with activation energy Ea ~ 0.3eV to 0.7eV."
  source_type: "aerospace_government"
  source: "NASA-TM-111186"
  title: "Accelerated Stress Testing Handbook"
  organization: "NASA"
  url: "https://ntrs.nasa.gov/"
  publication_date: "1997"
  relevant_section: "Section 4.1"
  relevance: "Calibrates activation energy constants for our Phase 4 synthetic burn-in generator."
  status: "VERIFIED"
