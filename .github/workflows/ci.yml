name: PREDICTA CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predicta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-certify:
    name: Validate and Certify Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "import httpx2; print('httpx2', httpx2.__version__)"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Python source
        run: python -m ruff check src tests

      - name: Run Python unit and validation tests
        run: |
          python -m pytest tests -v --ignore=tests/test_phase16_scientific_proof.py

      - name: Run authoritative production certification
        run: npm run certify:production

      - name: Publish certification status
        if: always()
        run: |
          echo "## PREDICTA CI Certification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python validation: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Phase 16 scientific proof: executed in dedicated CI job" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authoritative production certification: executed (frozen-artifact validation; no training)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Core certification: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release certification: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Phase 2 security & authorization: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Phase 2 production hardening & invariant locks: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rate-limit anti-spoofing & client ML spoof equivalence: verified" >> "$GITHUB_STEP_SUMMARY"

  phase16-scientific-proof:
    name: Phase 16 Scientific Proof
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run Phase 16 scientific proof suite
        run: |
          python -m pytest tests/test_phase16_scientific_proof.py -v --durations=20

      - name: Publish scientific proof status
        if: always()
        run: |
          echo "## PREDICTA Phase 16 Scientific Proof" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical cases: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ablation integrity: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threshold protection: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provenance/leakage checks: executed" >> "$GITHUB_STEP_SUMMARY"
