name: PREDICTA CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint with Ruff
        run: python -m ruff check scripts src tests

      - name: Run Python Unit and Validation Tests
        run: python -m pytest tests -v

      - name: Verify native XGBoost model integrity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import xgboost as xgb

          model_path = "ml/models/production/predicta_xgboost_model.json"
          manifest_path = "ml/models/production/predicta_production_manifest.json"

          classifier = xgb.XGBClassifier()
          classifier.load_model(model_path)

          with open(model_path, "r", encoding="utf-8") as model_file:
              normalized = model_file.read().replace("\r\n", "\n")
          computed = hashlib.sha256(normalized.encode("utf-8")).hexdigest()

          with open(manifest_path, "r", encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)

          expected = manifest["model_sha256"]
          if computed != expected:
              raise SystemExit(
                  f"SHA-256 mismatch: computed={computed}, manifest={expected}"
              )

          print(f"[OK] Native XGBoost model loaded and SHA-256 verified: {computed}")
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run Node.js Full Regression and Cross-Runtime Parity Suite
        run: npm test
