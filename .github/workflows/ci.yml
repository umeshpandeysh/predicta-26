name: PREDICTA CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pandas numpy scikit-learn pyyaml

    - name: Lint with Ruff
      run: |
        ruff check scripts src tests

    - name: Run Python Unit & Validation Test Suite
      run: |
        pytest tests

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: npm ci || npm install

    - name: Run Node.js Full Regression & Cross-Runtime Parity Suite
      run: npm test
