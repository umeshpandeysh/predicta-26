name: PREDICTA CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predicta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-certify:
    name: Validate and Certify Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "import httpx2; print('httpx2', httpx2.__version__)"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Python source
        run: python -m ruff check src tests

      - name: Run Python unit and validation tests
        run: python -m pytest tests -v

      - name: Run authoritative production certification
        run: npm run certify:production

      - name: Publish certification status
        if: always()
        run: |
          echo "## PREDICTA CI Certification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python validation: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authoritative ML training: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Core certification: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release certification: executed by certify:production" >> "$GITHUB_STEP_SUMMARY"
