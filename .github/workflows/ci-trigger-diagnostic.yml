name: PREDICTA CI Trigger Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: Verify GitHub Actions Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report trigger context
        run: |
          echo "PREDICTA GitHub Actions trigger is active"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
