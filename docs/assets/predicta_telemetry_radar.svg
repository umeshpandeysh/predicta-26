text x="250" y="593" text-anchor="middle" class="txt">Physics Reliability</text><rect x="100" y="650" width="130" height="55" rx="6" class="box"/><text x="165" y="683" text-anchor="middle" class="small">BTI / Timing</text><rect x="245" y="650" width="130" height="55" rx="6" class="box"/><text x="310" y="683" text-anchor="middle" class="small">Leakage</text><rect x="390" y="650" width="130" height="55" rx="6" class="box"/><text x="455" y="683" text-anchor="middle" class="small">Thermal</text><rect x="575" y="560" width="250" height="55" rx="6" class="box"/><text x="700" y="593" text-anchor="middle" class="txt">Evidence Layer</text><rect x="575" y="650" width="250" height="55" rx="6" class="box"/><text x="700" y="683" text-anchor="middle" class="txt">Risk Fusion</text><rect x="575" y="740" width="250" height="55" rx="6" class="box"/><text x="700" y="773" text-anchor="middle" class="txt">PASS / MONITOR / REJECT</text><rect x="950" y="560" width="250" height="55" rx="6" class="box"/><text x="1075" y="593" text-anchor="middle" class="txt">Operator / Secondary Test</text><rect x="950" y="650" width="250" height="55" rx="6" class="box"/><text x="1075" y="683" text-anchor="middle" class="txt">Adjudication</text><rect x="950" y="740" width="250" height="55" rx="6" class="box"/><text x="1075" y="773" text-anchor="middle" class="txt">Reliability Twin</text><path d="M700 210V260" class="line" marker-end="url(#a2)"/><path d="M700 210C700 230 250 220 250 260" class="line" marker-end="url(#a2)"/><path d="M700 210C700 230 1175 220 1175 260" class="line" marker-end="url(#a2)"/><path d="M700 315V350" class="line" marker-end="url(#a2)"/><path d="M560 410L700 445" class="line" marker-end="url(#a2)"/><path d="M770 410L700 445" class="line" marker-end="url(#a2)"/><path d="M965 410L700 445" class="line" marker-end="url(#a2)"/><path d="M250 315V350" class="line" marker-end="url(#a2)"/><path d="M250 405V440" class="line" marker-end="url(#a2)"/><path d="M250 495C350 530 500 545 575 575" clas