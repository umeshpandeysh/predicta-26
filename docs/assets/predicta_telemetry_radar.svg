<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Dark Mission Control Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Radar Sweep Radial Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Telemetry Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .spin, .pulse, .wave, .blink { animation: none !important; }
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    .radar-circle { stroke: #0284c7; stroke-width: 1.2; fill: none; opacity: 0.4; }
    .radar-axis { stroke: #0369a1; stroke-width: 1; opacity: 0.3; }
    
    .spin {
      transform-origin: 200px 160px;
      animation: rotateSweep 8s linear infinite;
    }
    .wave {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: waveTrace 4s ease-in-out infinite;
    }
    .pulse {
      animation: opacityPulse 2s ease-in-out infinite alternate;
    }
    .blink {
      animation: blinkDot 1.5s ease-in-out infinite alternate;
    }

    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes waveTrace {
      0% { stroke-dashoffset: 600; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -600; }
    }
    @keyframes opacityPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.9; }
    }
    @keyframes blinkDot {
      0% { r: 3px; opacity: 0.4; }
      100% { r: 5px; opacity: 1; }
    }
  </style>

  <!-- Container Background -->
  <rect width="900" height="320" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Background Grid Lines -->
  <line x1="40" y1="40" x2="860" y2="40" class="grid-line"/>
  <line x1="40" y1="100" x2="860" y2="100" class="grid-line"/>
  <line x1="40" y1="160" x2="860" y2="160" class="grid-line"/>
  <line x1="40" y1="220" x2="860" y2="220" class="grid-line"/>
  <line x1="40" y1="280" x2="860" y2="280" class="grid-line"/>

  <!-- Left: Mission-Critical Wafer Radar Sweeper -->
  <g id="radarGroup">
    <circle cx="200" cy="160" r="120" class="radar-circle"/>
    <circle cx="200" cy="160" r="90" class="radar-circle"/>
    <circle cx="200" cy="160" r="60" class="radar-circle"/>
    <circle cx="200" cy="160" r="30" class="radar-circle"/>
    
    <line x1="80" y1="160" x2="320" y2="160" class="radar-axis"/>
    <line x1="200" y1="40" x2="200" y2="280" class="radar-axis"/>
    <line x1="115" y1="75" x2="285" y2="245" class="radar-axis"/>
    <line x1="115" y1="245" x2="285" y2="75" class="radar-axis"/>

    <!-- Rotating Radar Sector Sweep -->
    <g class="spin">
      <path d="M 200 160 L 200 40 A 120 120 0 0 1 304 100 Z" fill="url(#radarSweep)"/>
      <line x1="200" y1="160" x2="200" y2="40" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>
    </g>

    <!-- Detected Wafer Anomalies / Die Targets -->
    <circle cx="240" cy="110" r="4" fill="#ef4444" filter="url(#cyanGlow)" class="blink"/>
    <circle cx="160" cy="210" r="3.5" fill="#10b981" filter="url(#emeraldGlow)"/>
    <circle cx="220" cy="200" r="3.5" fill="#10b981" filter="url(#emeraldGlow)"/>
    <circle cx="150" cy="120" r="3.5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  </g>

  <!-- Middle: Real-Time Parameter Telemetry Graph -->
  <g id="telemetryGraph">
    <text x="360" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">LIVE ATE PARAMETRIC TELEMETRY WAVEFORM</text>
    
    <!-- Graph Baseline -->
    <line x1="360" y1="240" x2="840" y2="240" stroke="#475569" stroke-width="1.5"/>
    <line x1="360" y1="70" x2="360" y2="240" stroke="#475569" stroke-width="1.5"/>

    <!-- Nominal Dynamic Telemetry Signal (Cyan) -->
    <path class="wave" d="M 360 170 Q 400 120, 440 170 T 520 170 T 600 110 T 680 190 T 760 140 T 840 160" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#cyanGlow)"/>
    
    <!-- Threshold Margin Signal (Emerald) -->
    <path d="M 360 110 Q 420 110, 480 110 T 600 110 T 720 110 T 840 110" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" class="pulse"/>

    <!-- Critical Threshold Boundary Line (Red) -->
    <line x1="360" y1="90" x2="840" y2="90" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="6 3"/>
    <text x="750" y="85" fill="#f43f5e" font-family="sans-serif" font-size="10" font-weight="700">θ* = 0.20 GATE</text>
  </g>

  <!-- Right: Status Metrics Panel -->
  <g id="statusTelemetry" transform="translate(360, 260)">
    <rect x="0" y="0" width="150" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="12" y="16" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700">INFERENCE LATENCY</text>
    <text x="12" y="32" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">0.034 ms / req</text>

    <rect x="165" y="0" width="150" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="177" y="16" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700">FAIL RECALL (LOCKED)</text>
    <text x="177" y="32" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">97.31% (θ* = 0.20)</text>

    <rect x="330" y="0" width="150" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="342" y="16" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700">GPR EARLY WARNING</text>
    <text x="342" y="32" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">6.23 Wafers Lead</text>
  </g>
</svg>
