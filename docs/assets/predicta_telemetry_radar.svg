<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1450" viewBox="0 0 1400 1450"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#42a5f5"/><stop offset="1" stop-color="#7cdbff"/></linearGradient><style>.bg{fill:#080c12}.t{fill:#eef4fa;font:700 24px Arial}.s{fill:#aebbc9;font:15px Arial}.b{fill:#121923;stroke:#667486;stroke-width:2}.p{stroke:url(#g);stroke-width:4;fill:none;stroke-linecap:round}.dot{fill:#7cdbff}.warn{fill:#f0b45b}.good{fill:#65d48b}.bad{fill:#ff6b6b}.box{fill:#151b22;stroke:#7c8795;stroke-width:2}.txt{fill:#e7edf5;font:16px Arial,sans-serif}.small{fill:#b9c4d0;font:14px Arial,sans-serif}.line{stroke:#8d99a8;stroke-width:2;fill:none}.arrow{fill:#8d99a8}</style><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" class="arrow"/></marker></defs><rect width="1400" height="1450" fill="#080c12"/><text x="700" y="45" text-anchor="middle" class="t">From Burn-In Telemetry to Qualification Decision</text><text x="700" y="73" text-anchor="middle" class="s">A visual summary of the PREDICTA decision path</text><g><rect x="50" y="180" width="180" height="105" rx="12" class="b"/><text x="140" y="215" text-anchor="middle" class="t" font-size="18">ATE TELEMETRY</text><text x="140" y="245" text-anchor="middle" class="s">V, I, T, timing, leakage</text><text x="140" y="267" text-anchor="middle" class="s">early burn-in observations</text></g><g><rect x="300" y="180" width="180" height="105" rx="12" class="b"/><text x="390" y="215" text-anchor="middle" class="t" font-size="18">ANOMALY</text><text x="390" y="245" text-anchor="middle" class="s">MAD · COPOD · IF</text><text x="390" y="267" text-anchor="middle" class="s">unusual behaviour detected</text></g><g><rect x="550" y="180" width="180" height="105" rx="12" class="b"/><text x="640" y="215" text-anchor="middle" class="t" font-size="18">DEGRADATION</text><text x="640" y="245" text-anchor="middle" class="s">0h + 24h evidence</text><text x="640" y="267" text-anchor="middle" class="s">toward 168h behaviour</text></g><g><rect x="800" y="180" width="180" height="105" rx="12" class="b"/><text x="890" y="215" text-anchor="middle" class="t" font-size="18">PHYSICS</text><text x="890" y="245" text-anchor="middle" class="s">BTI · timing · leakage</text><text x="890" y="267" text-anchor="middle" class="s">thermal consistency</text></g><g><rect x="1050" y="180" width="180" height="105" rx="12" class="b"/><text x="1140" y="215" text-anchor="middle" class="t" font-size="18">DECISION</text><text x="1140" y="245" text-anchor="middle" class="s">XGBoost + evidence fusion</text><text x="1140" y="267" text-anchor="middle" class="s">PASS · MONITOR · REJECT</text></g><path d="M230 232H300M480 232H550M730 232H800M980 232H1050" class="p"/><circle r="7" class="dot" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M140 232 H390 H640 H890 H1140"/></circle><path d="M640 310 C640 390 890 390 890 310" stroke="#f0b45b" stroke-width="3" fill="none" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.5s" repeatCount="indefinite"/></path><text x="765" y="405" text-anchor="middle" class="s">trajectory + physical evidence are checked together</text><g><rect x="475" y="445" width="450" height="42" rx="21" fill="#121923" stroke="#667486"/><circle cx="520" cy="466" r="9" class="good"/><text x="540" y="471" class="s">normal → PASS</text><circle cx="690" cy="466" r="9" class="warn"/><text x="710" y="471" class="s">uncertain → MONITOR</text><circle cx="870" cy="466" r="9" class="bad"/><text x="890" y="471" class="s">risk → REJECT</text></g><g transform="translate(0 540)"><text x="700" y="42" text-anchor="middle" class="txt" font-size="24">PREDICTA-26 — Semiconductor Qualification Pipeline</text><rect x="545" y="70" width="310" height="55