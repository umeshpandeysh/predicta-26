<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">PREDICTA PS-170 Module A and Module B qualification flow</title>
<desc id="desc">Animated flow from burn-in telemetry through dynamic anomaly detection, time-series drift prediction, reliability checks, evidence fusion and final component screening decision.</desc>
<defs>
<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker>
<style>
.bg{fill:#080d14}.title{fill:#f8fafc;font:700 28px Arial,sans-serif}.sub{fill:#a9b7c7;font:15px Arial,sans-serif}
.box{fill:#111923;stroke:#5b6b7d;stroke-width:2}.moduleA{fill:#102338;stroke:#38bdf8;stroke-width:2}.moduleB{fill:#17251d;stroke:#62d394;stroke-width:2}
.head{fill:#f1f5f9;font:700 18px Arial,sans-serif}.txt{fill:#d6dee8;font:14px Arial,sans-serif}.small{fill:#9fb0c1;font:13px Arial,sans-serif}
.flow{stroke:url(#flow);stroke-width:3;fill:none;marker-end:url(#arrow)}.green{stroke:#62d394}.gold{stroke:#f2c46d}.decision{fill:#172033;stroke:#a8b9d0;stroke-width:2}
</style></defs>
<rect class="bg" width="1400" height="1050"/>
<text x="700" y="46" text-anchor="middle" class="title">PREDICTA — SIH PS-170 Screening Flow</text>
<text x="700" y="75" text-anchor="middle" class="sub">AI-driven anomaly detection in component burn-in and screening</text>

<rect x="45" y="115" width="1310" height="115" rx="14" class="box"/>
<text x="75" y="150" class="head">BURN-IN / ATE TELEMETRY</text>
<text x="75" y="180" class="txt">Early electrical observations: Iddq, leakage, propagation delay, temperature and related qualification parameters</text>
<text x="75" y="205" class="small">Validated against the PREDICTA feature contract before any model or screening decision is made.</text>

<path d="M700 230V270" class="flow"/>
<rect x="480" y="270" width="440" height="62" rx="10" class="box"/>
<text x="700" y="297" text-anchor="middle" class="head">INPUT VALIDATION + FEATURE CONTRACT</text>
<text x="700" y="318" text-anchor="middle" class="small">16 raw telemetry inputs → 28-feature inference representation</text>

<path d="M590 332V380" class="flow"/>
<path d="M810 332V380" class="flow green"/>
<rect x="95" y="380" width="540" height="205" rx="14" class="moduleA"/>
<text x="365" y="415" text-anchor="middle" class="head">MODULE A — DYNAMIC OUTLIER DETECTION</text>
<text x="365" y="443" text-anchor="middle" class="txt">Static limits can miss a part that is abnormal relative to its lot.</text>
<rect x="125" y="468" width="145" height="72" rx="8" class="box"/><text x="197" y="497" text-anchor="middle" class="head" font-size="15">Robust MAD</text><text x="197" y="518" text-anchor="middle" class="small">lot-relative shift</text>
<rect x="292" y="468" width="145" height="72" rx="8" class="box"/><text x="364" y="497" text-anchor="middle" class="head" font-size="15">COPOD</text><text x="364" y="518" text-anchor="middle" class="small">tail behaviour</text>
<rect x="459" y="468" width="145" height="72" rx="8" class="box"/><text x="531" y="497" text-anchor="middle" class="head" font-size="15">Isolation Forest</text><text x="531" y="518" text-anchor="middle" class="small">feature combinations</text>

<rect x="765" y="380" width="540" height="205" rx="14" class="moduleB"/>
<text x="1035" y="415" text-anchor="middle" class="head">MODULE B — TIME-SERIES DRIFT PREDICTION</text>
<text x="1035" y="443" text-anchor="middle" class="txt">Use early measurements to estimate future degradation behaviour.</text>
<rect x="805" y="468" width="200" height="72" rx="8" class="box"/><text x="905" y="497" text-anchor="middle" class="head" font-size="15">0h + 24h</text><text x="905" y="518" text-anchor="middle" class="small">early observations</text>
<rect x="1065" y="468" width="200" height="72" rx="8" class="box"/><text x="1165" y="497" text-anchor="middle" class="head" font-size="15">48h → 168h</text><text x="1165" y="518" text-anchor="middle" class="small">trajectory / safety slope</text>
<path d="M1005 504H1065" class="flow green"/>

<path d="M365 585V625" class="flow"/>
<path d="M1035 585V625" class="flow green"/>
<rect x="260" y="625" width="880" height="82" rx="12" class="decision"/>
<text x="700" y="656" text-anchor="middle" class="head">EVIDENCE + RELIABILITY CHECKS</text>
<text x="700" y="682" text-anchor="middle" class="txt">XGBoost failure-risk estimate • BTI/timing • leakage • thermal consistency • trajectory evidence</text>

<path d="M700 707V750" class="flow gold"/>
<rect x="405" y="750" width="590" height="72" rx="12" class="box"/>
<text x="700" y="780" text-anchor="middle" class="head">EVIDENCE FUSION + QUALIFICATION RULES</text>
<text x="700" y="803" text-anchor="middle" class="small">Risk, anomaly, safety and reliability evidence are combined before disposition.</text>

<path d="M700 822V865" class="flow"/>
<rect x="235" y="865" width="930" height="82" rx="12" class="decision"/>
<text x="700" y="896" text-anchor="middle" class="head">SCREENING DECISION</text>
<text x="700" y="923" text-anchor="middle" class="txt">PASS — MONITOR — REJECT</text>
<text x="700" y="942" text-anchor="middle" class="small">Operator review / secondary test → adjudication → Reliability Twin trace</text>

<circle cx="75" cy="175" r="7" fill="#7dd3fc" filter="url(#glow)">
<animate attributeName="cx" values="75;1325;75" dur="7s" repeatCount="indefinite"/>
</circle>
</svg>