<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">PREDICTA — animated semiconductor burn-in screening</title>
<desc id="desc">A component moves through burn-in checkpoints while PREDICTA detects an unusual lot-relative signal, projects time-series drift toward 168 hours, and produces screening evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111e"/>
    <stop offset="0.55" stop-color="#0b1522"/>
    <stop offset="1" stop-color="#060b12"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#60a5fa"/>
  </linearGradient>
  <linearGradient id="forecast" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="0.65" stop-color="#f5b75c"/>
    <stop offset="1" stop-color="#ff6b6b"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#64748b"/>
  </marker>
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#f8fafc;letter-spacing:.3px}
    .subtitle{font:14px Arial,sans-serif;fill:#94a3b8}
    .label{font:700 12px Arial,sans-serif;fill:#9fb3c8;letter-spacing:1.3px}
    .text{font:15px Arial,sans-serif;fill:#d9e3ed}
    .small{font:12px Arial,sans-serif;fill:#8fa2b5}
    .tiny{font:11px Arial,sans-serif;fill:#7f94a8}
    .panel{fill:#0d1724;stroke:#26384a;stroke-width:1.5}
    .chip{fill:#101c29;stroke:#59728a;stroke-width:1.5}
    .die{fill:#162638;stroke:#3a566f;stroke-width:1}
    .wire{stroke:#32516b;stroke-width:1;fill:none}
    .path{fill:none;stroke:url(#cyan);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .forecastPath{fill:none;stroke:url(#forecast);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 10;animation:dash 1.6s linear infinite}
    .safe{stroke:#6c7f91;stroke-width:1.5;stroke-dasharray:7 7;fill:none}
    .axis{stroke:#33495e;stroke-width:1}
    .moduleA{fill:#0e2030;stroke:#256b8d;stroke-width:1.5}
    .moduleB{fill:#10231d;stroke:#3c7c5e;stroke-width:1.5}
    .anomaly{fill:#f3b65f}
    .risk{fill:#ff6b6b}
    .pass{fill:#62d394}
    .pulse{fill:#e7fbff}
    .reveal{animation:fadeIn 8s ease-in-out infinite}
    .softPulse{animation:pulse 2.4s ease-in-out infinite}
    .anomalyPulse{animation:alert 3.8s ease-in-out infinite}
    .forecastPulse{animation:forecastPulse 3.8s ease-in-out infinite}
    .move{animation:movePulse 7.6s linear infinite}
    .move2{animation:movePulse2 7.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-40}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes alert{0%,42%{opacity:0;transform:scale(.6)}48%,68%{opacity:1;transform:scale(1)}76%,100%{opacity:0;transform:scale(.6)}}
    @keyframes forecastPulse{0%,60%{opacity:0}68%,82%{opacity:1}90%,100%{opacity:0}}
    @keyframes fadeIn{0%,12%{opacity:0;transform:translateY(8px)}20%,84%{opacity:1;transform:translateY(0)}94%,100%{opacity:0}}
    @keyframes movePulse{0%{transform:translate(0,0);opacity:0}5%{opacity:1}42%{transform:translate(245px,0)}44%,54%{transform:translate(245px,0)}70%{transform:translate(720px,0)}78%{transform:translate(860px,0);opacity:1}86%,100%{transform:translate(860px,0);opacity:0}}
    @keyframes movePulse2{0%,48%{opacity:0;transform:translate(0,0)}55%{opacity:1}88%{transform:translate(370px,0);opacity:1}100%{transform:translate(370px,0);opacity:0}}
    @media (prefers-reduced-motion:reduce){.forecastPath,.reveal,.softPulse,.anomalyPulse,.forecastPulse,.move,.move2{animation:none!important}}
  </style>
</defs>

<rect width="1400" height="820" rx="18" fill="url(#bg)"/>
<circle cx="700" cy="360" r="360" fill="url(#halo)" opacity=".35"/>

<text x="70" y="58" class="title">PREDICTA — From Burn-In Telemetry to Early Defect Screening</text>
<text x="70" y="86" class="subtitle">A visual explanation of the SIH PS-170 idea: dynamic outliers + time-series drift toward the 168h burn-in endpoint.</text>

<!-- LEFT: COMPONENT -->
<rect x="55" y="125" width="300" height="560" rx="16" class="panel"/>
<text x="82" y="160" class="label">COMPONENT UNDER TEST</text>
<text x="82" y="188" class="text">Burn-in / ATE observations</text>

<!-- chip -->
<rect x="112" y="225" width="186" height="186" rx="24" fill="#0a1320" stroke="#35516a" stroke-width="2"/>
<rect x="140" y="253" width="130" height="130" rx="12" class="chip"/>
<rect x="166" y="279" width="78" height="78" rx="8" fill="#12283a" stroke="#4b708b" stroke-width="1.5"/>
<path d="M179 318h52M205 292v52" class="wire"/>
<circle cx="205" cy="318" r="9" fill="#38bdf8" opacity=".9" filter="url(#glow)" class="softPulse"/>
<g stroke="#55748b" stroke-width="3">
<path d="M112 250H92M112 275H92M112 300H92M112 325H92M112 350H92M112 375H92"/>
<path d="M298 250H318M298 275H318M298 300H318M298 325H318M298 350H318M298 375H318"/>
<path d="M137 225V205M162 225V205M187 225V205M212 225V205M237 225V205M262 225V205"/>
<path d="M137 411V431M162 411V431M187 411V431M212 411V431M237 411V431M262 411V431"/>
</g>

<text x="82" y="458" class="label">BURN-IN CHECKPOINTS</text>
<g>
<circle cx="95" cy="495" r="6" fill="#60a5fa"/><text x="115" y="499" class="text">0h</text><text x="165" y="499" class="small">initial electrical state</text>
<circle cx="95" cy="532" r="6" fill="#60a5fa"/><text x="115" y="536" class="text">24h</text><text x="165" y="536" class="small">early burn-in evidence</text>
<circle cx="95" cy="569" r="6" fill="#f3b65f"/><text x="115" y="573" class="text">96h</text><text x="165" y="573" class="small">drift becomes measurable</text>
<circle cx="95" cy="606" r="6" fill="#ff6b6b"/><text x="115" y="610" class="text">168h</text><text x="165" y="610" class="small">late reliability outcome</text>
</g>
<text x="82" y="651" class="tiny">One device • many observations • one evidence chain</text>

<!-- CENTER: TELEMETRY -->
<rect x="390" y="125" width="650" height="560" rx="16" class="panel"/>
<text x="420" y="160" class="label">TELEMETRY BEHAVIOUR</text>
<text x="420" y="188" class="text">The key question is not only “does it pass?” — it is “how is it changing?”</text>

<!-- Module A -->
<rect x="420" y="215" width="260" height="72" rx="10" class="moduleA"/>
<text x="442" y="242" class="label" fill="#6edcff">MODULE A · DYNAMIC OUTLIER</text>
<text x="442" y="267" class="small">Compare the die with its lot / peer population</text>

<!-- Module B -->
<rect x="705" y="215" width="305" height="72" rx="10" class="moduleB"/>
<text x="727" y="242" class="label" fill="#86e0a7">MODULE B · DRIFT PREDICTION</text>
<text x="727" y="267" class="small">Use early observations to project later burn-in behaviour</text>

<!-- chart -->
<rect x="420" y="315" width="590" height="260" rx="10" fill="#09131f" stroke="#25394c"/>
<line x1="465" y1="520" x2="975" y2="520" class="axis"/>
<line x1="465" y1="345" x2="465" y2="520" class="axis"/>
<line x1="465" y1="385" x2="975" y2="385" class="safe"/>
<text x="965" y="377" text-anchor="end" class="tiny">safety slope / limit</text>

<!-- grid -->
<g stroke="#1a2a3a" stroke-width="1">
<path d="M590 345V520M715 345V520M840 345V520"/>
<path d="M465 430H975M465 475H975"/>
</g>

<!-- observed and forecast -->
<path d="M475 500 C535 491, 555 480, 600 475 C640 471, 675 470, 715 456" class="path"/>
<path d="M715 456 C760 447, 795 430, 835 411 C885 390, 925 362, 970 348" class="forecastPath"/>

<!-- checkpoint labels -->
<text x="475" y="545" class="tiny">0h</text>
<text x="705" y="545" class="tiny">24h</text>
<text x="830" y="545" class="tiny">96h</text>
<text x="960" y="545" text-anchor="end" class="tiny">168h</text>

<!-- 24h marker and anomaly halo -->
<circle cx="715" cy="456" r="17" fill="#f3b65f" opacity=".12" class="anomalyPulse"/>
<circle cx="715" cy="456" r="6" class="anomaly" filter="url(#glow)" class="softPulse"/>
<text x="715" y="438" text-anchor="middle" class="tiny" fill="#f3b65f">subtle drift</text>

<!-- future warning -->
<g class="forecastPulse">
<circle cx="905" cy="374" r="22" fill="#ff6b6b" opacity=".12"/>
<circle cx="905" cy="374" r="6" class="risk" filter="url(#glow)"/>
<text x="905" y="350" text-anchor="middle" class="tiny" fill="#ff9d9d">projected risk</text>
</g>

<!-- moving particle along observed path -->
<circle r="7" class="pulse">
  <animateMotion dur="7.6s" repeatCount="indefinite" path="M475 500 C535 491 555 480 600 475 C640 471 675 470 715 456"/>
</circle>
<!-- moving particle along future path -->
<circle r="6" fill="#ffd28b" filter="url(#glow)" opacity=".8">
  <animateMotion dur="7.6s" begin="3.5s" repeatCount="indefinite" path="M715 456 C760 447 795 430 835 411 C885 390 925 362 970 348"/>
</circle>

<!-- small annotations -->
<text x="438" y="610" class="label">WHAT MODULE A SEES</text>
<text x="438" y="636" class="small">A part can be inside the absolute limit and still be unusual for its lot.</text>
<text x="438" y="658" class="small">Robust MAD / PAT • COPOD • Isolation Forest</text>

<!-- RIGHT: DECISION -->
<rect x="1075" y="125" width="270" height="560" rx="16" class="panel"/>
<text x="1102" y="160" class="label">SCREENING EVIDENCE</text>
<text x="1102" y="188" class="text">Signals meet here before the decision.</text>

<g transform="translate(1102 225)">
<rect width="216" height="66" rx="10" class="box" fill="#111b27"/>
<text x="18" y="27" class="label">FAILURE RISK</text>
<text x="18" y="51" class="text">XGBoost probability</text>
</g>
<g transform="translate(1102 307)">
<rect width="216" height="66" rx="10" class="box" fill="#111b27"/>
<text x="18" y="27" class="label">ANOMALY EVIDENCE</text>
<text x="18" y="51" class="text">lot-relative + multivariate</text>
</g>
<g transform="translate(1102 389)">
<rect width="216" height="66" rx="10" class="box" fill="#111b27"/>
<text x="18" y="27" class="label">RELIABILITY CHECK</text>
<text x="18" y="51" class="text">BTI · timing · leakage · thermal</text>
</g>
<path d="M1210 455V488" stroke="#627488" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1102" y="500" width="216" height="98" rx="12" class="decision"/>
<text x="1210" y="528" text-anchor="middle" class="label">QUALIFICATION</text>
<text x="1210" y="559" text-anchor="middle" class="text">PASS · MONITOR · REJECT</text>
<text x="1210" y="582" text-anchor="middle" class="small">operator review + traceability</text>

<!-- cross-panel flow -->
<path d="M355 350C370 350 375 350 390 350" stroke="#4f718d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1040 350C1055 350 1060 350 1075 350" stroke="#4f718d" stroke-width="2" marker-end="url(#arrow)"/>

<!-- animated flow particles -->
<circle r="6" fill="#e7fbff" filter="url(#glow)">
  <animateMotion dur="7.6s" repeatCount="indefinite" path="M340 350 C500 350 740 350 1045 350"/>
</circle>

<!-- bottom narrative -->
<rect x="390" y="710" width="955" height="65" rx="12" fill="#0a131f" stroke="#22374b"/>
<text x="420" y="737" class="label">THE LATENT-DEFECT IDEA</text>
<text x="420" y="760" class="text">Looks acceptable early → shows unusual behaviour → projected drift worsens → evidence triggers earlier screening.</text>

<text x="70" y="760" class="tiny">SIH 2026 • Problem Statement 170</text>
</svg>